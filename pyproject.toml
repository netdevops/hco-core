[tool.poetry]
name = "hco-core"
version = "0.1.0a0"
description = "Ports and domain models for building network configuration orchestration on hier_config"
authors = ["James Williams <jtdub@example.com>"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/netdevops/hco-core"
repository = "https://github.com/netdevops/hco-core"
keywords = ["network", "automation", "configuration", "hier-config", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
packages = [{ include = "hco_core", from = "." }]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
pydantic = "^2.9"
hier-config = ">=4.0.0b4,<5.0"
pyyaml = ">=6.0"
sqlalchemy = {version = "^2.0", extras = ["asyncio"]}
alembic = "^1.13"
psycopg = {version = "^3.2", extras = ["binary", "pool"]}
pydantic-settings = "^2.5"
structlog = ">=24.4"
python-ulid = ">=3.0"
langgraph = "^1.2"
langgraph-checkpoint-postgres = "^3.2"
fastapi = "^0.128"
uvicorn = {version = "^0.40", extras = ["standard"]}
typer = "^0.27"
httpx = "^0.28"
scrapli = {version = ">=2025.1.30,<2025.8", optional = true}

[tool.poetry.extras]
scrapli = ["scrapli"]

[tool.poetry.scripts]
hco-core = "hco_core.cli.app:app"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "*"
mypy = "*"
pyright = "*"
ruff = "*"
towncrier = "*"
types-pyyaml = "*"


[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.7.7"

[build-system]
requires = ["poetry-core>=2.3.2"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["hco_core", "tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
preview = true
ignore = [
    "missing-trailing-comma",           # formatter's job
    "missing-copyright-notice",         # LICENSE + NOTICE cover it
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    "line-too-long",                    # formatter's job
    "single-line-implicit-string-concatenation",
    "undocumented-public-init",
    "undocumented-public-package",
    "docstring-missing-returns",        # types carry it; prose would restate
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "assert",                           # pytest is built on assert
    "import-private-name",
    "undocumented-public-module",
]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 95

[tool.towncrier]
directory = "changes"
filename = "CHANGELOG.md"
package = "hco_core"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] - {project_date}"
issue_format = "[#{issue}](https://github.com/netdevops/hco-core/issues/{issue})"
underlines = ["", "", ""]
ignore = ["README.md"]
template = "changes/_template.md"

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "dependencies"
name = "Dependencies"
showcontent = true

[[tool.towncrier.type]]
directory = "documentation"
name = "Documentation"
showcontent = true
