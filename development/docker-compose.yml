name: hco-core

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hco
      POSTGRES_PASSWORD: hco
      POSTGRES_DB: hco
    volumes:
      - hco-core-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hco -d hco"]
      interval: 5s
      timeout: 5s
      retries: 10

  hco-core-api:
    build:
      context: ..
      dockerfile: development/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    ports:
      - "127.0.0.1:${HCO_API_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hco-core-postgres:
