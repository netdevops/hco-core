---
name: ci

on:
  push:
    branches: [develop, next]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 runs but is not required: scrapli, which downstream consumers
        # need, does not yet declare it. Promote when it does.
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hco
          POSTGRES_PASSWORD: hco
          POSTGRES_DB: hco
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hco -d hco"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HCO_DATABASE_URL: postgresql://hco:hco@localhost:5432/hco
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pipx install poetry
      - run: poetry check --lock
      - run: poetry install --no-interaction --all-extras --with docs
      - name: Render the changelog fragments
        run: poetry run towncrier build --draft --version 0.0.0
      - run: poetry run ruff format --check .
      - run: poetry run ruff check --output-format=concise .
      - run: poetry run mypy hco_core
      - run: poetry run pyright
      - name: Allow one unconditional interrupt() in each graph node
        run: poetry run hco-core lint-interrupts hco_core
      - run: poetry run pytest -q --cov=hco_core --cov-report=term-missing --cov-fail-under=95
      - name: Hold the validation gate at 100% line and branch coverage
        run: poetry run pytest -q tests/engine/test_validation.py --cov=hco_core.engine.validation --cov-branch --cov-report=term-missing --cov-fail-under=100
      - name: Build the documentation site, and fail on a broken link
        run: poetry run mkdocs build --strict

  # Advisory only. Reports green even when the required jobs above fail, so
  # read it alongside them rather than on its own. Promote to the matrix when
  # the downstream consumers' dependencies declare 3.14.
  smoke-3-14-advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hco
          POSTGRES_PASSWORD: hco
          POSTGRES_DB: hco
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hco -d hco"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HCO_DATABASE_URL: postgresql://hco:hco@localhost:5432/hco
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pipx install poetry
      - run: poetry check --lock
      - run: poetry install --no-interaction --all-extras --with docs
      # The same checks as the required jobs, so an advisory pass means the
      # same thing they do.
      - name: Render the changelog fragments
        run: poetry run towncrier build --draft --version 0.0.0
      - run: poetry run ruff format --check .
      - run: poetry run ruff check --output-format=concise .
      - run: poetry run mypy hco_core
      - run: poetry run pyright
      - name: Allow one unconditional interrupt() in each graph node
        run: poetry run hco-core lint-interrupts hco_core
      - run: poetry run pytest -q --cov=hco_core --cov-report=term-missing --cov-fail-under=95
      - name: Hold the validation gate at 100% line and branch coverage
        run: poetry run pytest -q tests/engine/test_validation.py --cov=hco_core.engine.validation --cov-branch --cov-report=term-missing --cov-fail-under=100
      - name: Build the documentation site, and fail on a broken link
        run: poetry run mkdocs build --strict
